   function sintaxis(expr) {

var texto;
var res;
//presult = document.getElementById('presult');
    try {

             texto = result.textContent;// || result.innerText;

// otro cambio

<script>
   
  function generarpoli(expr) {
   var poli = "";
    var xo =0;
    var ndig =4;
  //var dato= expr.value;
  //probando.innerHTML="";
  f = parser.eval('b ='+expr.value);

  var tojava =[];
 
  
for (var k = 1; k<=f.size() ; k++){
    parser.set('k',k); 
    var a = parser.eval('a1=b[k]');

  //var a = parser.eval('a1=b['+k+']');
  a = math.round(Number((a)),ndig);
  tojava.push(a);

}

for(var k=0; k < tojava.length; k++ )
  {
      //parser.set('k',k); 

    if (xo == 0)
     var m = "*x^"+k;
   if (xo < 0)
     var m = "*(x+"+(-1)*xo+")^"+k;
   if (xo > 0)
    var m = "*(x-"+xo+")^"+k;
   if(k == 0) 
    poli += tojava[k]; //parser.eval((der_n[k]));
    if ((k > 0) && (tojava[k] != 0) && (tojava[k] > 0) )
    poli +="+"+tojava[k]+m; //parser.eval((der_n[k]))
   if ((k > 0) && (tojava[k] != 0) && (tojava[k] < 0) )
    poli +="-"+(-1)*tojava[k]+m; //parser.eval((der_n[k]))
 
  }
             presult.textContent = poli;

}

</script>
<script>
  //
  //  Use a closure to hide the local variables from the
  //  global namespace
  //
  function mathmas() {
    var QUEUE = MathJax.Hub.queue;  // shorthand for the queue
    var math = null, box = null;    // the element jax for the math output, and the box it's in

    //
    //  Hide and show the box (so it doesn't flicker as much)
    //
    var HIDEBOX = function () {box.style.visibility = "hidden"}
    var SHOWBOX = function () {box.style.visibility = "visible"}

    //
    //  Get the element jax when MathJax has produced it.
    //
    QUEUE.Push(function () {
      math = MathJax.Hub.getAllJax("MathOutput")[0];
      box = document.getElementById("box");
      SHOWBOX(); // box is initially hidden so the braces don't show
    });

    //
    //  The onchange event handler that typesets the math entered
    //  by the user.  Hide the box, then typeset, then show it again
    //  so we don't see a flash as the math is cleared and replaced.
    //
    window.UpdateMath = function () {
     var TeX = presult.textContent;  // 
     //TeX = (parser.eval('f(x) ='+TeX)).toTex();
      QUEUE.Push(["Text",math,TeX]);
    }
       
  }
</script>

<script type="text/javascript">
  function product_pq(){
  var th01 = document.getElementById("th01");
th01.textContent = "P * Q->[co,c1,..ck]";
      var p1 = parser.eval('p ='+expr.value);
      //var aux1 = parser.eval('p ='+expr.value);
      var array_aux=[];

      var q1 = parser.eval('q ='+exprq.value);
  
      var tamanopxq =parseInt(math.add(p1.size(), q1.size())) -1 //parseInt(n + m + 1);
      //var pxq = math.matrix();   //[];
      //pxq =math.zeros(tamanopxq);
      var temp = math.zeros(tamanopxq);

      p1 = p1.resize([tamanopxq],0); 

      var pr =parser.eval('pr = '+p1);

      var ptemp = parser.eval('ptemp = '+temp);       // Matrix, size [2],    [7, 7]
          presult.textContent ="";

      for (var k = 1; k <= q1.size() ; k++){
        parser.set('k',k); 
        var a = parser.eval('a1=q[k]');
        
            var p3 = parser.eval('a=q[k]*pr');
            if (k > 1){
              array_aux = cambiarArray_java(p3);

              for(var j = 1; j < k; j++ ){ 
              rotar_array(array_aux);
              }//pr = parser.eval('pr='+p2); 
                p3 = math.matrix(array_aux); // Matrix, size [0]
            }
              ptemp = math.add(p3,ptemp);

           // presult.textContent +=p3+"+"+pr+"="+p2+"=>";
      }
      var res = cambiarArray_java(ptemp);
      res = math.matrix(res);   //parser.eval('a='+(pr+p2));
      result.textContent =res; //ptemp;
      exprpq.value = res;
      generarpoli(exprpq);
      //UpdateMath();

  }

  function suma_pq(){
var th01 = document.getElementById("th01");
th01.textContent = "P + Q->[co,c1,..ck]";
      var p1 = parser.eval('p ='+expr.value);
      //var aux1 = parser.eval('p ='+expr.value);
      var array_aux=[];

      var q1 = parser.eval('q ='+exprq.value);
      var n = math.add(p1.size(),0);
      n = parseInt(n);
      var m = math.add(q1.size(),0);
      m = parseInt(m);
      //var tamanopxq1 = n + m -1;
      //var tamanopxq =parseInt(math.add(p1.size(), q1.size())) -1 //parseInt(n + m + 1);
      var tama;
      if (n > m){tama = n-m; q1 = q1.resize([n],0); }
      else if (n < m ){tama =m-n; p1 = p1.resize([m],0);}

      var temp ="";// math.zeros(tama);
          temp  =math.add(q1, p1);
      var ptemp = parser.eval('ptemp = '+temp);       // Matrix, size [2],    [7, 7]
          presult.textContent ="";
      
      var res = cambiarArray_java(ptemp);
      res = math.matrix(res);   //parser.eval('a='+(pr+p2));
      result.textContent =res; //ptemp;
      exprpq.value = res;
      generarpoli(exprpq);
      UpdateMath();

  }

function resta_pq(){
var th01 = document.getElementById("th01");
th01.textContent = "P - Q->[co,c1,..ck]";
      var p1 = parser.eval('p ='+expr.value);
      //var aux1 = parser.eval('p ='+expr.value);
      var array_aux=[];

      var q1 = parser.eval('q ='+exprq.value);
      var n = math.add(p1.size(),0);
      n = parseInt(n);
      var m = math.add(q1.size(),0);
      m = parseInt(m);
      //var tamanopxq1 = n + m -1;
      //var tamanopxq =parseInt(math.add(p1.size(), q1.size())) -1 //parseInt(n + m + 1);
      var tama;
      if (n > m){tama = n-m; q1 = q1.resize([n],0); }
      else if (n < m ){tama =m-n; p1 = p1.resize([m],0);}

      var temp ="";// math.zeros(tama);
          temp  =math.subtract(p1, q1);
      var ptemp = parser.eval('ptemp = '+temp);       // Matrix, size [2],    [7, 7]
          presult.textContent ="";
      
      var res = cambiarArray_java(ptemp);
      res = math.matrix(res);   //parser.eval('a='+(pr+p2));
      result.textContent =res; //ptemp;
      exprpq.value = res;
      generarpoli(exprpq);
      UpdateMath();

  }

function cambiarArray_java(expr){
    var  f = parser.eval('b ='+expr);
      var tojava =[];
      var ndig =4;
      for (var k = 1; k<=f.size() ; k++){
        parser.set('k',k); 
        var a = parser.eval('a1=b[k]');
        a = math.round(Number(a),ndig);
        tojava.push(a);
      }
  
    return tojava;
}

function rotar_array(arreglo){
  var elem1 = arreglo.pop();
  arreglo = arreglo.unshift(elem1);
  //var pcho = parser.eval('pcho ='+(arreglo));   
}
