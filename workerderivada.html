<head>

  <script src="math.js"></script>
  <script> 
		function iniciar() {
		
		dfx();
		dfy();
	}
	
		function dfx() {
		var fxy=document.getElementById('eq').value;
		//var parser = math.parser();
		//parser.eval('g(x,y) ='+fxy);
		var h = math.parse(fxy); // 12
		//var g1 = parser.eval('g(x,y)'); 
		var dfx = math.derivative(h, 'x').toString();
		//var dfy = math.derivative(h, 'y').toString();
		//document.getElementById("dfx").value = dfx; 
		document.getElementById("cajadatosfx").innerHTML ='df/dx = '+ dfx;
		//document.getElementById("cajadatosfy").innerHTML ='df/dy = '+ dfy;

	}
	function dfy() {
		var fxy=document.getElementById('eq').value;
		//var parser = math.parser();
		//parser.eval('g(x,y) ='+fxy);
		var h = math.parse(fxy); // 12
		//var g1 = parser.eval('g(x,y)'); 
		//var dfx = math.derivative(h, 'x').toString();
		var dfy = math.derivative(h, 'y').toString();
		//document.getElementById("dfx").value = dfx; 
		//document.getElementById("cajadatosfx").innerHTML ='df/dx = '+ dfx;
		document.getElementById("cajadatosfy").innerHTML ='df/dy = '+ dfy;

	}
	
	window.addEventListener("load", iniciar());
  </script>

		</td></tr>
		<tr><td>
      
      <input type="button" name="boton" onclick="dfx();" id="boton"

	</td></tr></table>
