  function muestraContenido() {

if(peticion_http.status == 200) {
 eval(peticion_http.responseText);
 }else {peticion_http.abort();}
}
}
  function Coger() {//Función coger, en esta caso le entra

	document.getElementById("ideuler").innerHTML = "Procesando datos espere por favor numero de iteraciones..."+niteracion;
	peticion_http.onreadystatechange = muestraContenido;
	peticion_http.open('GET', 'euler.txt', true);
	peticion_http.send(null);
}
function abortar(){
	peticion_http.abort();

}

function dfdx(df,t,y){
 // var parser = math.parser();
  
  parser.eval('g(t,y) ='+df);
  parser.set('t',t);
  parser.set('y',y);
  var g1 = parser.eval('g(t,y)'); 
  g1 = parseFloat(g1);
    return g1;
}
