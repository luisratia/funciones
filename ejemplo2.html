function getRandInteger(min, max){
	return (Math.floor(Math.random()*(max - min +1) + min));
}


function asignaFunct(){
n1 = getRandInteger(1, 3);
n = getRandInteger(1, 6);
m = getRandInteger(1, 4);
cadena =m+ "*cosh(x)^"+n+"+sinh(x)^"+n1;
document.getElementById('eq').value=cadena;
}

function asignaCadena(){
n1 = getRandInteger(1, 2);
n = getRandInteger(1, 2);
m = getRandInteger(2, 4);
cadena = m+"*cosh(x)^"+n+"+sinh(x)^"+n1;
if ((n==1) && (n1!=1)){
	cadena = m+"*cosh(x)"+" +sinh(x)^"+n1;
}
if ((n!=1) && (n1==1)){
	cadena = m+"*cosh(x)^"+n +" +sinh(x)";
}
if ((n==1) && (n1==1)){
	cadena = m+"*cosh(x)" +" +sinh(x)";
}


return cadena;
//document.getElementById('eq').value=cadena;
}
var parser = math.parser();

function integrate(eq, start, end, step) {
		var total = 0.0;
		//step=0.001; //step || 0.01;
		parser.eval('g(x) ='+eq);
		for (var x = start; x <= end; x += step) {
			parser.set('x',x);
			parser.set('step',step);
			g1= parser.eval('g(x + step/2)');
			g1 = parseFloat(g1);
			total = total+ g1*step;
	}
	return total;
}


function ArregloFunct(){
var versionesObj = new Array(
'x',
'x^2',
'x^3',
'x^4',
'x^5');

var operadoresObj = new Array(
'+',
'-',
'*',
'/');
n = versionesObj.length;
k = operadoresObj.length;
j = getRandInteger(0, k-1);
i = getRandInteger(0, n-1);
//m = operadoresObj[j];
cadena2=versionesObj[i];
cadena = asignaCadena();
document.getElementById('eq').value=cadena2+" "+operadoresObj[j]+" ("+cadena+")";
//return cadena2;
}
